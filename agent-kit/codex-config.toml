# Codex config for the interview sandbox (CODEX_HOME=~/.interview-env/codex).
# Generated by tech-interview-bootstrap; @WORKSPACE@ is replaced at install time.

# Keep login credentials in $CODEX_HOME/auth.json (not the macOS keychain)
# so `ibx uninstall` removes them along with everything else.
cli_auth_credentials_store = "file"

# Tight defaults (OpenAI best practice): edits allowed inside the workspace,
# the model asks before anything else. Web search uses the cached index.
sandbox_mode = "workspace-write"
approval_policy = "on-request"
web_search = "cached"

[projects."@WORKSPACE@"]
trust_level = "trusted"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]

[mcp_servers.fetch]
command = "uvx"
args = ["mcp-server-fetch"]
